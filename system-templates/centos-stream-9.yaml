# CentOS Stream 9 系统模板 (企业级标配)
# 适用于模拟生产环境
template_name: centos-stream-9
description: CentOS Stream 9 (Official) - 企业级 Linux，适合生产环境
app_label: centos-app
cpu_cores: 2
memory: 4Gi
rootfs_size: 40Gi
data_size: 30Gi
run_strategy: Always
image_url: docker://quay.io/containerdisks/centos-stream:9
cloud_init_user: centos
cloudinit_data: |
  #cloud-config
  hostname: ${hostname}
  manage_etc_hosts: true
  ssh_pwauth: true
  disable_root: false
  timezone: Asia/Shanghai
  chpasswd:
    list: |
      root:changeme
      centos:changeme
    expire: false
  users:
    - name: root
      lock_passwd: false
    - name: centos
      groups: wheel
      sudo: ALL=(ALL) NOPASSWD:ALL
      lock_passwd: false
  # 自动安装 QEMU Guest Agent (重要：用于获取 VM IP 地址)
  packages:
    - qemu-guest-agent
  runcmd:
    - systemctl enable --now qemu-guest-agent
    - echo "Welcome to KubeVirt Shepherd!" > /etc/motd
